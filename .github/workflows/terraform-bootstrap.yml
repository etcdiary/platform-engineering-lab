name: Terraform Bootstrap

on:
  workflow_dispatch:


  push:
    branches:
      - "feature/**"
    paths:
      - "terraform/platform/**"
      - "terraform/modules/**"
      - ".github/workflows/sandbox.yml"


permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Bootstrap Terraform State
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264480534:role/github-platform-sandbox
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
        with:
          role-to-assume: arn:aws:iam::058264480534:role/github-platform-sandbox

      - name: Create bootstrap state bucket
        run: |
          if aws s3api head-bucket \
            --bucket platform-engineering-bootstrap-state 2>/dev/null; then
            echo "Bootstrap state bucket already exists"
          else
            aws s3api create-bucket \
              --bucket platform-engineering-bootstrap-state \
              --region eu-west-2 \
              --create-bucket-configuration LocationConstraint=eu-west-2
          fi

      - name: Enable bootstrap bucket versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket platform-engineering-bootstrap-state \
            --versioning-configuration Status=Enabled

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket platform-engineering-bootstrap-state \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: terraform/bootstrap
        run: terraform init

      - name: Terraform Format
        working-directory: terraform/bootstrap
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform/bootstrap
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/bootstrap
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform/bootstrap
        run: terraform apply -auto-approve