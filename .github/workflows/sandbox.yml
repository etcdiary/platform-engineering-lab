name: Sandbox Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "sandbox"
        type: choice
        options:
          - "sandbox"

  push:
    branches:
      - "feature/**"
    paths:
      - "terraform/platform/**"
      - "terraform/modules/**"
      - ".github/workflows/sandbox.yml"
      - "terraform/environments/sandbox/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264480534:role/github-platform-sandbox
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Verify Terraform version
        run: terraform version

      - name: Terraform Init
        working-directory: terraform/environments/sandbox
        run: terraform init 

      - name: Terraform Validate
        working-directory: terraform/environments/sandbox
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264480534:role/github-platform-sandbox
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          working-directory: terraform/environments/sandbox

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/sandbox

      - name: Terraform Plan
        working-directory: terraform/environments/sandbox
        run: terraform plan -out=tfplan
        use: actions/upload-artifact@v4
        env:
          TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}
          TF_VAR_recipient_email: ${{ vars.RECIPIENT_EMAIL }}

  apply:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264480534:role/github-platform-sandbox
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - working-directory: terraform/environments/sandbox
        run: terraform init
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/sandbox
      - working-directory: terraform/environments/sandbox
        run: terraform apply -auto-approve tfplan